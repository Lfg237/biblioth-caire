<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme des Matchs A6</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#dbeafe,#eff6ff);
}

/* PAGE */

.page{
    width:420px;
    min-height:595px;
    margin:auto;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:white;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* IMAGE FOND */

#backgroundPhoto{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.22;
    z-index:0;
}

/* OVERLAY */

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.92),
        rgba(255,255,255,0.96)
    );
    z-index:1;
    pointer-events:none;
}

/* CONTENU */

.content{
    position:relative;
    z-index:5;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.title{
    flex:1;
}

.title h1{
    margin:0;
    font-size:20px;
    color:#0f172a;
    font-weight:800;
}

.title h2{
    margin:4px 0 0;
    font-size:12px;
    color:#475569;
}

/* LOGO */

#logoBox{
    width:65px;
    height:65px;
    border-radius:16px;
    border:2px dashed #94a3b8;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    cursor:pointer;
    font-size:12px;
    font-weight:bold;
    color:#64748b;
}

/* ACTIONS */

.actions{
    display:flex;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

/* BUTTONS */

button{
    flex:1;
    border:none;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
    transition:0.3s;
}

#addMatchBtn{
    background:#10b981;
    color:white;
}

#changeBgBtn{
    background:#7c3aed;
    color:white;
}

#downloadBtn{
    background:#2563eb;
    color:white;
}

button:hover{
    transform:translateY(-2px);
}

/* TABLE */

.table-container{
    max-height:360px;
    overflow:auto;
    border-radius:14px;
    background:white;
    border:1px solid #dbeafe;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:12px;
}

th{
    background:linear-gradient(135deg,#10b981,#059669);
    color:white;
    padding:10px 5px;
    position:sticky;
    top:0;
    z-index:5;
}

td{
    border:1px solid #e2e8f0;
    padding:8px 5px;
    text-align:center;
    min-width:80px;
}

tr[contenteditable="true"]:hover{
    background:#f8fafc;
}

/* SIGNATURE */

.signature{
    margin-top:15px;
    text-align:center;
    font-size:11px;
    color:#64748b;
    border-top:1px solid #e2e8f0;
    padding-top:10px;
}

/* POPUP */

#downloadPopup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popupBox{
    width:300px;
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
}

.popupBox input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #cbd5e1;
    margin-top:10px;
}

.popupButtons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

#confirmDownload{
    background:#10b981;
    color:white;
}

#closePopup{
    background:#ef4444;
    color:white;
}

#popupError{
    color:red;
    font-size:12px;
}

</style>
</head>

<body>

<div class="page" id="pageContent">

    <!-- IMAGE FOND -->

    <img 
        id="backgroundPhoto"
        src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=1200&auto=format&fit=crop"
    >

    <div class="overlay"></div>

    <div class="content">

        <!-- HEADER -->

        <div class="header">

            <div class="title">

                <h1 contenteditable="true">
                    Nom de l'entreprise
                </h1>

                <h2 contenteditable="true">
                    Programme des Matchs 2025
                </h2>

            </div>

            <!-- LOGO -->

            <div id="logoBox">

                Logo

            </div>

            <input 
                type="file"
                id="logoInput"
                accept="image/*"
                hidden
            >

        </div>

        <!-- ACTIONS -->

        <div class="actions">

            <button id="addMatchBtn">
                ➕ Ajouter Match
            </button>

            <button id="changeBgBtn">
                🖼 Changer Fond
            </button>

            <button id="downloadBtn">
                ⬇ Télécharger PDF
            </button>

        </div>

        <!-- INPUT FOND -->

        <input 
            type="file"
            id="bgInput"
            accept="image/*"
            hidden
        >

        <!-- TABLE -->

        <div class="table-container">

            <table id="matchesTable">

                <tr>
                    <th>Equipe A</th>
                    <th>Equipe B</th>
                    <th>Date</th>
                    <th>Heure</th>
                    <th>Lieu</th>
                    <th>Organisateur</th>
                </tr>

                <tr contenteditable="true">

                    <td>Team 1</td>
                    <td>Team 2</td>
                    <td>12/04/2025</td>
                    <td>16:00</td>
                    <td>Stade Central</td>
                    <td>Ligue Locale</td>

                </tr>

            </table>

        </div>

        <div class="signature">
            Créé par LesFacilitateurs • WhatsApp : +237651475255
        </div>

    </div>

</div>

<!-- POPUP -->

<div id="downloadPopup">

    <div class="popupBox">

        <h2>🔐 Confirmation</h2>

        <p>
            Entrez le code 233
        </p>

        <input 
            type="password"
            id="downloadCode"
            placeholder="Code 233"
        >

        <p id="popupError"></p>

        <div class="popupButtons">

            <button id="confirmDownload">
                ✅ Confirmer
            </button>

            <button id="closePopup">
                ⬅ Retour
            </button>

        </div>

    </div>

</div>

<script>

/* LOGO */

const logoBox =
document.getElementById('logoBox');

const logoInput =
document.getElementById('logoInput');

logoBox.onclick = function(){

    logoInput.click();

};

logoInput.onchange = function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(ev){

        logoBox.innerHTML = `
            <img
                src="${ev.target.result}"
                style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                "
            >
        `;

    }

    reader.readAsDataURL(file);

};

/* FOND */

const bgInput =
document.getElementById('bgInput');

const changeBgBtn =
document.getElementById('changeBgBtn');

const backgroundPhoto =
document.getElementById('backgroundPhoto');

changeBgBtn.onclick = function(){

    bgInput.click();

};

bgInput.onchange = function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(ev){

        backgroundPhoto.src =
        ev.target.result;

        localStorage.setItem(
            'customBackground',
            ev.target.result
        );

    }

    reader.readAsDataURL(file);

};

/* RESTORE BG */

window.onload = function(){

    const savedBg =
    localStorage.getItem('customBackground');

    if(savedBg){

        backgroundPhoto.src = savedBg;

    }

};

/* AJOUT MATCH */

document.getElementById('addMatchBtn')
.onclick = function(){

    const table =
    document.getElementById('matchesTable');

    const row =
    table.insertRow();

    row.contentEditable = 'true';

    for(let i=0;i<6;i++){

        const cell =
        row.insertCell();

        cell.innerHTML = '...';

    }

};

/* POPUP */

const popup =
document.getElementById('downloadPopup');

const popupError =
document.getElementById('popupError');

document.getElementById('downloadBtn')
.onclick = function(){

    popup.style.display = 'flex';

    popupError.textContent = '';

    document.getElementById('downloadCode').value = '';

};

document.getElementById('closePopup')
.onclick = function(){

    popup.style.display = 'none';

};

/* CONFIRMATION */

document.getElementById('confirmDownload')
.onclick = function(){

    const code =
    document.getElementById('downloadCode')
    .value
    .trim();

    if(code !== '233'){

        popupError.textContent =
        '❌ Code invalide';

        return;

    }

    popup.style.display = 'none';

    downloadPDF();

};

/* PDF */

function downloadPDF(){

    const element =
    document.getElementById('pageContent');

    const opt = {

        margin:0.2,

        filename:'Programme_Matchs_A6_233.pdf',

        image:{
            type:'jpeg',
            quality:1
        },

        html2canvas:{
            scale:3,
            useCORS:true
        },

        jsPDF:{
            unit:'mm',
            format:'a6',
            orientation:'portrait'
        }

    };

    html2pdf()
    .set(opt)
    .from(element)
    .save();

}

</script>

</body>
</html>
